name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend API Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CodeForge Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run Jest & Supertest Integration Suite
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_KEY: codeforge_ci_test_secret_key_123456789
        run: npm test
